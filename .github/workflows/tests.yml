name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite3, pdo_sqlite, zip, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          composer install --no-interaction --prefer-dist
          npm ci || npm install
          npm run build

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
